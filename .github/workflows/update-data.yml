name: Actualiser les données chaque jour

on:
  schedule:
    # Chaque matin à 04:17 UTC (05:17 en hiver, 06:17 en été à Paris).
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Un lancement manuel sur une autre branche ne doit pas modifier la base.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Vérifier les calculs et les collecteurs
        run: python -m unittest discover -s tests -v

      - name: Vérifier les secrets nécessaires
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: |
          python - <<'PY'
          import os
          required = ('SUPABASE_URL', 'SUPABASE_KEY', 'OPENAQ_API_KEY')
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Secrets GitHub manquants : ' + ', '.join(missing))
          PY

      - name: Collecter et mettre à jour Supabase
        id: collect
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        # Le runner repart sans les caches DVF : les fichiers sont retéléchargés.
        run: python -m src.main_pipeline

      - name: Présenter le bilan dans GitHub Actions
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('data/pipeline-run.json')
          if path.exists():
              report = json.loads(path.read_text(encoding='utf-8'))
              text = f"## Mise à jour des données\n\n{len(report['updated'])} / {report['requested']} villes mises à jour.\n"
              text += f"\nServices : {len(report.get('fresh_services', []))} collectes nouvelles ; {len(report.get('retained_services', []))} collectes précédentes conservées.\n"
              for error in report['failed']:
                  text += f"\n- Ville non mise à jour : {error['city']} ({error['error']})"
              for error in report['source_errors']:
                  retained = ' — derniers chiffres conservés avec leur date' if error.get('retained') else ''
                  text += f"\n- Actualisation indisponible : {error['city']} · {error['source']} ({error['error']}){retained}"
          else:
              text = '## Mise à jour interrompue\n\nAucun bilan de collecte disponible. Consulter les logs.\n'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(text)
          PY

      - name: Repérer les villes mises à jour
        id: publication
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('data/pipeline-run.json')
          updated = path.exists() and bool(json.loads(path.read_text(encoding='utf-8'))['updated'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"updated={'true' if updated else 'false'}\n")
          PY

      - name: Publier les métadonnées des villes mises à jour
        if: always() && steps.publication.outputs.updated == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- web/data/provenance.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: actualiser les observations et leur provenance'
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi

      - name: Conserver le bilan et les métadonnées
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: data-refresh-${{ github.run_id }}
          path: |
            data/pipeline-run.json
            web/data/provenance.json
          retention-days: 30
          if-no-files-found: warn

      - name: Signaler une collecte incomplète
        if: always() && steps.collect.outcome == 'failure'
        run: |
          echo 'La collecte est incomplète. Les données disponibles ont été publiées ; consulter le bilan.'
          exit 1
